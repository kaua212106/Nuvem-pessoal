<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora</title>
<style>
:root{--bg:#f6f6f6;--fg:#000;--sub:#8c8c8c;--op:#ee8340;--card:#fff;--line:#e6e6e6;--eq:#ee8340;--key:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--sub:#7a7a7a;--card:#1c1c1e;--line:#2a2a2a;--key:#fff}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--sub:#7a7a7a;--card:#1c1c1e;--line:#2a2a2a;--key:#fff}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Mi Sans","MiSans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 0}
.bar button{background:none;border:0;color:var(--fg);font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer}
.bar button:active{background:var(--line)}
.bar .mode{font-size:13px;color:var(--sub);letter-spacing:.3px}
.disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:0 24px 12px;min-height:0;overflow:hidden}
#expr{font-size:52px;font-weight:300;text-align:right;word-break:break-all;line-height:1.15;max-height:100%;overflow-y:auto;scrollbar-width:none;transition:font-size .1s}
#expr::-webkit-scrollbar{display:none}
#prev{font-size:26px;color:var(--sub);height:34px;margin-top:6px;font-weight:300}
.sci{display:none;grid-template-columns:repeat(5,1fr);padding:0 12px;gap:0}
.sci.on{display:grid}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px;padding:10px 16px 22px}
.k{border:0;background:none;color:var(--key);font:inherit;font-size:30px;font-weight:300;height:64px;border-radius:32px;cursor:pointer;transition:background .12s}
.k:active{background:var(--line)}
.sci .k{font-size:18px;height:44px;color:var(--sub)}
.k.op{color:var(--op);font-size:34px}
.k.fn{color:var(--op);font-size:26px}
.k.eq{background:var(--eq);color:#fff;font-size:34px}
.k.eq:active{filter:brightness(.9);background:var(--eq)}
.sheet{position:absolute;inset:0;background:var(--bg);transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.sheet.on{transform:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;font-size:20px}
.sh-h button{background:none;border:0;color:var(--op);font-size:16px;cursor:pointer}
#hist{flex:1;overflow:auto;padding:0 20px}
.h{padding:14px 0;border-bottom:1px solid var(--line);text-align:right;cursor:pointer}
.h small{display:block;color:var(--sub);font-size:16px}
.h b{font-weight:300;font-size:30px}
.empty{color:var(--sub);text-align:center;margin-top:80px}
.cv{padding:0 20px;overflow:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:0;background:var(--card);color:var(--fg);padding:8px 16px;border-radius:20px;font-size:15px;cursor:pointer}
.chip.on{background:var(--op);color:#fff}
.box{background:var(--card);border-radius:20px;padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.box input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font-size:30px;font-weight:300;outline:0;font-family:inherit}
.box select{border:0;background:none;color:var(--op);font-size:17px;font-family:inherit;outline:0;max-width:45%}
.menu{position:absolute;top:56px;right:16px;background:var(--card);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.2);padding:6px;display:none;z-index:6}
.menu.on{display:block}
.menu div{padding:12px 22px;cursor:pointer;border-radius:10px;font-size:16px}
.menu div:active{background:var(--line)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px 20px;overflow:auto;flex:1;align-content:start}
.gal .t{aspect-ratio:1;background:var(--card);overflow:hidden;cursor:pointer;position:relative}
.gal img,.gal video{width:100%;height:100%;object-fit:cover;display:block}
.gal-e{color:var(--sub);text-align:center;margin-top:90px;padding:0 30px;line-height:1.5}
.view{position:absolute;inset:0;background:#000;z-index:9;display:none;flex-direction:column}
.view.on{display:flex}
.view .vb{display:flex;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px}
.view .vb button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
.view .vb .del{color:#ff5252}
.view .vc{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.view .vc img,.view .vc video{max-width:100%;max-height:100%}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:12}.modal.on{display:flex}
.mc{background:var(--card);color:var(--fg);border-radius:24px;padding:24px;width:80%;max-width:320px}
.mc h3{margin:0 0 14px;font-weight:400;font-size:18px}
.mc input{width:100%;box-sizing:border-box;border:0;border-bottom:2px solid var(--op);background:none;color:var(--fg);font-size:24px;padding:8px 0;outline:0;letter-spacing:4px;font-family:inherit}
.mc .er{color:#ff5252;font-size:14px;min-height:18px;margin-top:8px}
.mc .bt{display:flex;gap:10px;margin-top:10px}.mc .bt button{flex:1;border:0;border-radius:22px;height:44px;font-size:16px;cursor:pointer;background:var(--line);color:var(--fg)}.mc .bt .ok{background:var(--op);color:#fff}
.toast{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;z-index:13;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}

/* ===== Visual idêntico ao app Calculadora (Xiaomi) ===== */
:root{--op:#ee8340;--eq:#ee8340;--xbg:#000;--xkey:#242424;--xnum:#f5f5f5;--xsub:#858585;--xsci:#b4b4b4;--xcard:#262626;--xmenu:#2d2d2d;--xtab:#8c8c8c;--xfg:#fff;--xic:#dcdcdc;--xblue:#5a8cf2;--xsec:#868aa6;--xscrim:rgba(0,0,0,.72)}
@media (prefers-color-scheme:light){:root{--bg:#f2f2f2;--fg:#000;--card:#fff;--line:#e2e2e2;--key:#000;--xbg:#f2f2f2;--xkey:#fff;--xnum:#111;--xsub:#8a8a8a;--xsci:#555;--xcard:#fff;--xmenu:#fff;--xtab:#8a8a8a;--xfg:#000;--xic:#333;--xscrim:rgba(0,0,0,.35)}}
:root{--bg:var(--xbg)}
@media (prefers-color-scheme:light){:root{--bg:#f2f2f2}}
html,body{background:var(--xbg)}
body{font-family:"MiSans","Mi Sans",Roboto,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.xm{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--xbg);padding-top:env(safe-area-inset-top,0px)}
.xh{position:relative;display:flex;align-items:center;justify-content:center;height:56px;margin-top:10px;flex:none}
.xh .xi{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border:0;background:none;color:var(--xfg);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.xh .xi svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.xh .xi svg .f{fill:currentColor;stroke:none}
#xCol{left:14px}#xMore{right:14px}
.xt{display:flex;gap:26px}
.xt button{background:none;border:0;font:inherit;font-size:17px;color:var(--xtab);padding:8px 0;cursor:pointer;letter-spacing:.2px}
.xt button.on{color:var(--xfg)}
.xp{display:none;flex:1;min-height:0;flex-direction:column}.xp.on{display:flex}
.xdisp{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 28px}
#xhist{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;margin-bottom:clamp(36px,16vh,140px)}
.xhi{font-size:18px;line-height:31px;color:var(--xsub);white-space:nowrap;cursor:pointer;flex:none;font-weight:300}
#xin{font-size:44px;font-weight:300;line-height:55px;color:var(--xfg);text-align:right;overflow:hidden;max-height:165px;overflow-wrap:anywhere;margin-bottom:0;flex:none}
#xpre{height:40px;line-height:40px;margin:4px 0 20px;font-size:26px;font-weight:300;color:var(--xsub);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#xin i{display:inline-block;width:2px;height:50px;background:var(--op);vertical-align:middle;margin-left:1px;animation:xbl 1s steps(1) infinite;transform:translateY(-3px)}
@keyframes xbl{50%{opacity:0}}
.xk{padding:0 28px calc(env(safe-area-inset-bottom,0px) + 26px);flex:none}
.xg{display:none;gap:10.7px}.xg.on{display:grid}
.xg4{grid-template-columns:repeat(4,1fr)}.xg5{grid-template-columns:repeat(5,1fr)}
.kx{border:0;background:var(--xkey);color:var(--xnum);font:inherit;font-size:30px;font-weight:300;height:min(58px,7.1vh);min-height:46px;border-radius:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:filter .1s;-webkit-tap-highlight-color:transparent}
.kx:active{filter:brightness(1.6)}
@media (prefers-color-scheme:light){.kx:active{filter:brightness(.88)}}
.kx svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.kx svg .f{fill:currentColor;stroke:none}
.kx.op,.kx.fn{color:var(--op)}
.kx.op{font-size:30px}.kx.fn{font-size:30px}
.kx.fn.t{font-size:27px;font-weight:400}
.kx.eq{background:var(--op);color:#fff;font-size:32px}
.kx.eq:active{filter:brightness(.9)}
.xg5 .kx{height:min(52.7px,6.3vh);min-height:40px;border-radius:17px;font-size:26px}
.xg5 .kx.s{font-size:21px;color:var(--xsci)}
.xg5 .kx.s.act{color:var(--op)}
.xg5 .kx.op,.xg5 .kx.fn{font-size:26px}.xg5 .kx.fn.t{font-size:24px}.xg5 .kx.eq{font-size:28px}
.kx sup{font-size:.62em;line-height:0;position:relative;top:-.45em;margin-left:1px}
.kx sub{font-size:.62em;line-height:0;position:relative;top:.3em}
/* conversor */
.xcg{display:grid;grid-template-columns:repeat(3,1fr);padding:36px 4px 30px;overflow:auto;align-content:start}
.xci{display:flex;flex-direction:column;align-items:center;height:133px;cursor:pointer;color:var(--xic);background:none;border:0;font:inherit;-webkit-tap-highlight-color:transparent}
.xci svg{width:34px;height:34px;fill:currentColor;overflow:visible}
.xci svg .b{stroke:var(--xbg);fill:none}.xci svg .g{fill:var(--xbg);stroke:none}.xci svg .l{fill:none;stroke:currentColor}
.xci span{font-size:13.5px;margin-top:12px;line-height:1.2;text-align:center;white-space:nowrap;letter-spacing:-.1px}
.xci:active{opacity:.6}
/* menu */
.xscrim{position:absolute;inset:0;background:var(--xscrim);z-index:20;display:none}.xscrim.on{display:block}
.xmenu{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 56px);width:200px;background:var(--xmenu);border-radius:22px;padding:5px 0;z-index:21;display:none;box-shadow:0 8px 30px rgba(0,0,0,.35)}.xmenu.on{display:block}
.xmenu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--xfg);font:inherit;font-size:17px;padding:0 20px;height:50px;cursor:pointer}
.xmenu button:active{background:rgba(128,128,128,.2)}
/* telas */
.xs{position:absolute;inset:0;background:var(--xbg);display:none;flex-direction:column;z-index:4;padding-top:env(safe-area-inset-top,0px);color:var(--xfg)}.xs.on{display:flex}
.xsh{position:relative;display:flex;align-items:center;justify-content:center;height:56px;margin-top:10px;flex:none}
.xsh b{font-weight:400;font-size:17px}
.xsh .bk{position:absolute;left:14px;top:50%;margin-top:-22px;width:44px;height:44px;border:0;background:none;color:var(--xfg);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.xsh .bk svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.xsh .rt{position:absolute;right:18px;top:50%;margin-top:-20px;height:40px;border:0;background:none;color:var(--op);font:inherit;font-size:16px;cursor:pointer}
.xsb{flex:1;overflow:auto;padding:0 12px 30px}
.xsec{color:var(--xsec);font-size:13.5px;margin:22px 0 10px 16px}
.xcard{background:var(--xcard);border-radius:23px;margin-bottom:12px}
.xprev{padding:22px 16px 20px;text-align:right;height:auto}
.xprev .a{color:var(--xsub);font-size:26px;font-weight:300;line-height:1.4}
.xprev .b{font-size:52px;font-weight:300;line-height:1.25;color:var(--xfg)}
.xopt{display:flex;align-items:center;padding:20px 16px;cursor:pointer;color:var(--xfg)}
.xopt div{flex:1}.xopt b{display:block;font-weight:400;font-size:18px}.xopt small{display:block;color:var(--xsub);font-size:15px;line-height:1.35;margin-top:3px}
.xopt svg{width:26px;height:26px;fill:none;stroke:var(--xblue);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:none;margin-left:10px;flex:none}
.xopt.on b,.xopt.on small{color:var(--xblue)}.xopt.on svg{display:block}
.xhl{padding:14px 16px;text-align:right;border-bottom:1px solid var(--line);cursor:pointer}
.xhl small{display:block;color:var(--xsub);font-size:17px;font-weight:300}.xhl b{font-weight:300;font-size:34px}
.xhe{color:var(--xsub);text-align:center;margin-top:90px}
.xdb{flex:1;overflow:auto;padding:6px 16px 30px}
.xdb .chips{margin:6px 0 16px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.xdb .chip{white-space:nowrap;flex:none}
.xdb .box{background:var(--xcard);border-radius:23px}
.xdb .box input,.xdb .box select{color:var(--xfg)}
.xdb .box select{color:var(--op)}
.xdb .box select option{color:#000}
.xdb .res{padding:10px 8px;font-size:24px;font-weight:300;line-height:1.6}
.chip.on{background:var(--op)}
.sheet,.nv,.modal,.toast{z-index:30}
.xs{z-index:4}

</style>
</head>
<body>
<div class="app">
  <div class="xm" id="xm">
    <div class="xh">
      <button class="xi" id="xCol" aria-label="Recolher"></button>
      <div class="xt"><button id="tCalc" class="on">Calculadora</button><button id="tConv">Conversor</button></div>
      <button class="xi" id="xMore" aria-label="Menu"></button>
    </div>
    <div class="xp on" id="xCalc">
      <div class="xdisp"><div id="xhist"></div><div id="xin"><span id="xtxt">0</span><i></i></div><div id="xpre"></div></div>
      <div class="xk" id="xk"><div class="xg xg4" id="xg4"></div><div class="xg xg5" id="xg5"></div></div>
    </div>
    <div class="xp" id="xConv"></div>
  </div>
  <div class="xscrim" id="xscrim"></div>
  <div class="xmenu" id="xmenu"><button id="mHist">Histórico</button><button id="mSet">Configurações</button></div>

  <div class="xs" id="xhs"><div class="xsh"><button class="bk" aria-label="Voltar"></button><b>Histórico</b><button class="rt" id="xhClr">Limpar</button></div><div class="xsb" id="xhb"></div></div>
  <div class="xs" id="xss"><div class="xsh"><button class="bk" aria-label="Voltar"></button><b>Calculadora</b></div>
    <div class="xsb"><div class="xsec">Percentual de adição e subtração</div>
      <div class="xcard xprev"><div class="a">100+50%</div><div class="b" id="xpv"></div></div>
      <div class="xcard xopt" id="oVal"><div><b>Por valor</b><small>Converter o percentual para um decimal, então adicionar ou subtrair</small></div><svg></svg></div>
      <div class="xcard xopt" id="oRat"><div><b>Por proporção</b><small>Aplicar o percentual aos resultados anteriores primeiro, e então adicionar ou subtrair — perfeito para descontos</small></div><svg></svg></div>
    </div></div>
  <div class="xs" id="xds"><div class="xsh"><button class="bk" aria-label="Voltar"></button><b id="xdT"></b></div><div class="xdb" id="xdb"></div></div>

  <div class="sheet" id="gs"><div class="sh-h"><span>Galeria</span><span><button id="gSet" aria-label="Ajustes">⚙</button> <button id="gAdd">+ Adicionar</button> <button id="gX">Sair</button></span></div><input type="file" id="gFile" accept="image/*,video/*" multiple hidden><div class="gal" id="gal"></div>
    <div class="view" id="gv"><div class="vb"><button id="gvX">‹ Voltar</button><button id="gvS">Baixar</button><button class="del" id="gvD">Excluir</button></div><div class="vc" id="gvc"></div></div></div>

  <div class="menu" id="gm" style="z-index:10"></div>

  <div class="modal" id="ps"><div class="mc"><h3 id="pm"></h3><input id="pi" type="password" inputmode="numeric" maxlength="12" autocomplete="off"><div class="er" id="pe"></div><div class="bt"><button id="pc">Cancelar</button><button class="ok" id="po">OK</button></div></div></div>

  <div class="toast" id="tt"></div>

</div>
<script>const $=s=>document.querySelector(s);
/* Galeria oculta (arquivos ficam só neste navegador, em IndexedDB) */
let db=null,urls=[],curId=null;
function gdb(){return new Promise((ok,no)=>{if(db)return ok(db);try{const q=indexedDB.open("calc_vault",1);q.onupgradeneeded=()=>q.result.createObjectStore("m",{autoIncrement:true});q.onsuccess=()=>{db=q.result;ok(db)};q.onerror=()=>no(q.error)}catch(x){no(x)}})}
function gtx(mode,fn){return gdb().then(d=>new Promise((ok,no)=>{const s=d.transaction("m",mode).objectStore("m");const r=fn(s);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
async function renderGal(){
  urls.forEach(URL.revokeObjectURL);urls=[];const g=$("#gal");g.innerHTML="";
  try{
    const keys=await gtx("readonly",s=>s.getAllKeys()),vals=await gtx("readonly",s=>s.getAll());
    if(!keys.length){g.innerHTML='<div class="gal-e" style="grid-column:1/-1">Galeria vazia.<br>Toque em “+ Adicionar” para guardar fotos e vídeos.</div>';return}
    keys.forEach((k,i)=>{const b=vals[i],u=URL.createObjectURL(b);urls.push(u);const t=document.createElement("div");t.className="t";
      t.innerHTML=b.type.startsWith("video")?'<video muted preload="metadata"></video>':'<img alt="">';t.firstChild.src=u;t.onclick=()=>openView(k,b,u);g.append(t)});
  }catch(x){g.innerHTML='<div class="gal-e" style="grid-column:1/-1">Não foi possível acessar o armazenamento deste navegador.</div>'}
}
function openView(k,b,u){curId=k;const c=$("#gvc");c.innerHTML=b.type.startsWith("video")?'<video controls autoplay playsinline></video>':'<img alt="">';c.firstChild.src=u;$("#gv").classList.add("on")}
function closeView(){$("#gv").classList.remove("on");$("#gvc").innerHTML=""}
/* Código de acesso e PIN (guardados só neste navegador; o PIN vai como hash) */
const LS={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
let MEMC=null;function getCode(){return LS.get("calc_code")||MEMC}
function setCode(v){LS.set("calc_code",v);MEMC=v}
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("vault:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(_){return "p:"+s}}
let pinCb=null;
function modal(title,cb){$("#pm").textContent=title;$("#pi").value="";$("#pe").textContent="";pinCb=cb;$("#ps").classList.add("on");setTimeout(()=>$("#pi").focus(),60)}
function toast(t){const x=$("#tt");x.textContent=t;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),2200)}
$("#pc").onclick=()=>{$("#ps").classList.remove("on");pinCb=null};
$("#po").onclick=async()=>{const cb=pinCb;if(!cb)return;const r=await cb($("#pi").value);if(r===true&&pinCb===cb){$("#ps").classList.remove("on");pinCb=null}else if(typeof r==="string")$("#pe").textContent=r};
$("#pi").addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();$("#po").click()}});
function setSecret(title,re,errMsg,save,okMsg){modal(title,v=>{if(!re.test(v))return errMsg;modal("Repita para confirmar",async v2=>{if(v2!==v)return "Os valores não conferem";await save(v);toast(okMsg);return true});return false})}
function enterGal(){$("#gs").classList.add("on");renderGal()}

<script>
/* ===== Galeria v2: criptografia AES-GCM, álbuns, notas, backup, ferramentas ===== */
const enc=new TextEncoder(),m=x=>isFinite(x)?x.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"—",
esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),
b2s=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)},
s2b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),msg=t=>'<div class="gal-e" style="grid-column:1/-1">'+t+'</div>';
let K=null,RAW=null,items=[],trash=[],vis=[],sel=new Set(),tab="f",alb="",selMode=false,picking=false,idle,vi=0,nid=null,lt=0,lt2=0,tx0=0;
$("#gs .sh-h").insertAdjacentHTML("afterend",'<div class="gtb" id="gtb"></div>');
$("#gal").insertAdjacentHTML("afterend",'<div id="sb"><button id="sMv">Mover</button><button class="dg" id="sDl">Excluir (0)</button><button id="sCn">Cancelar</button></div>');
$("#gs").insertAdjacentHTML("beforeend",'<input type="file" id="gImp" accept=".vault,.json,application/json" hidden><div class="nv" id="nv"><div class="bt"><button id="nB">‹ Voltar</button><button id="nD" style="color:#ff5252">Excluir</button><button id="nE">Baixar</button><button id="nS">Salvar</button></div><textarea id="nt" placeholder="Escreva sua nota…"></textarea></div>');
$(".app").insertAdjacentHTML("beforeend",'<div class="sheet" id="ts"><div class="sh-h"><span>Ferramentas</span><button id="tX">Fechar</button></div><div class="cv"><div class="chips" id="tc"></div><div id="tf"></div><div class="res" id="tr"></div></div></div>');

document.addEventListener("keydown",ev=>{if(ev.target.tagName==="TEXTAREA")ev.stopImmediatePropagation()},true);

/* banco e chave */
function gdb(){return new Promise((ok,no)=>{if(db)return ok(db);try{const q=indexedDB.open("calc_vault",3);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains("m"))d.createObjectStore("m",{autoIncrement:true});if(!d.objectStoreNames.contains("k"))d.createObjectStore("k");if(!d.objectStoreNames.contains("t"))d.createObjectStore("t")};q.onsuccess=()=>{db=q.result;ok(db)};q.onerror=()=>no(q.error)}catch(x){no(x)}})}
/* exclusão vai para a lixeira (marca "del"); s.destroy apaga de vez */
function softS(s){return{get:k=>s.get(k),getAll:()=>s.getAll(),getAllKeys:()=>s.getAllKeys(),add:v=>s.add(v),put:(v,k)=>s.put(v,k),destroy:k=>s.delete(k),
  delete(k){const f={},fin=()=>{f.onsuccess&&f.onsuccess()},fail=e=>{f.error=e;f.onerror&&f.onerror()},g=s.get(k);
    g.onsuccess=()=>{const v=g.result;
      if(!v||v instanceof Blob||v.kind==="wall"){const q=s.delete(k);q.onsuccess=fin;q.onerror=()=>fail(q.error);return}
      v.del=Date.now();const p=s.put(v,k);p.onsuccess=fin;p.onerror=()=>fail(p.error)};
    g.onerror=()=>fail(g.error);return f}}}
let META=null,METAN="";
function tx(st,mode,fn){const w=st==="m"&&mode==="readwrite";if(w)META=null;return gdb().then(d=>new Promise((ok,no)=>{const s=d.transaction(st,mode).objectStore(st);const r=fn(w?softS(s):s);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})).then(x=>{if(w)META=null;return x})}
async function pk(pin,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function saveKey(pin){let r;if(pin){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));r={w:1,salt,iv,ct:await crypto.subtle.encrypt({name:"AES-GCM",iv},await pk(pin,salt),RAW)}}else r={w:0,raw:RAW};await tx("k","readwrite",s=>s.put(r,"key"))}
async function loadKey(pin){const r=await tx("k","readonly",s=>s.get("key"));
  if(!r){const old=LS.get("calc_pin");RAW=crypto.getRandomValues(new Uint8Array(32));
    if(old){if(await hash(pin||"")!==old){RAW=null;return false}await saveKey(pin);LS.del("calc_pin")}else await saveKey(null)}
  else if(r.w){try{RAW=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:r.iv},await pk(pin||"",r.salt),r.ct))}catch(_){return false}}
  else RAW=r.raw;
  K=await crypto.subtle.importKey("raw",RAW,"AES-GCM",false,["encrypt","decrypt"]);return true}
async function hasPin(){try{const r=await tx("k","readonly",s=>s.get("key"));return r?!!r.w:!!LS.get("calc_pin")}catch(_){return !!LS.get("calc_pin")}}
async function seal(buf,type,album){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,ct:await crypto.subtle.encrypt({name:"AES-GCM",iv},K,buf),type,album:album||""}}
const unseal=async it=>{let ct=it.ct;if(!ct){const r=await tx("m","readonly",s=>s.get(it.k));ct=r.ct}return crypto.subtle.decrypt({name:"AES-GCM",iv:it.iv},K,ct)};

/* modal com campo de texto opcional */
function modal(title,cb,txt){$("#pm").textContent=title;const i=$("#pi");i.value="";i.type=txt?"text":"password";i.inputMode=txt?"text":"numeric";i.maxLength=txt?30:12;i.style.letterSpacing=txt?"0":"4px";$("#pe").textContent="";pinCb=cb;$("#ps").classList.add("on");setTimeout(()=>i.focus(),60)}

/* abrir com limite de tentativas */
const wait=()=>Math.max(0,Math.ceil(((+LS.get("calc_until")||0)-Date.now())/1000));
async function openGal(){if(wait()>0){toast("Aguarde "+wait()+"s");return}
  try{if(!await hasPin()){await loadKey(null);return enterGal()}}catch(_){toast("Armazenamento indisponível");return}
  modal("Digite o PIN da galeria",async v=>{if(wait()>0)return "Aguarde "+wait()+"s";
    try{if(await loadKey(v)){LS.del("calc_fail");enterGal();return true}}catch(_){return "Erro ao abrir"}
    const n=(+LS.get("calc_fail")||0)+1;LS.set("calc_fail",n);
    if(n>=3){LS.set("calc_until",Date.now()+30000);LS.set("calc_fail",0);return "3 erros. Aguarde 30s"}return "PIN incorreto ("+n+"/3)"})}
function enterGal(){$("#gs").classList.add("on");tab="f";alb="";selMode=false;sel.clear();bump();renderGal()}

/* bloqueio: botão sair, toque duplo no topo, aba oculta, inatividade */
function lockGal(){K=null;RAW=null;items=[];vis=[];sel.clear();selMode=false;urls.forEach(URL.revokeObjectURL);urls=[];
  ["#gs","#gv","#nv","#ps"].forEach(s=>$(s).classList.remove("on"));$("#gvc").innerHTML="";$("#gal").innerHTML="";$("#nt").value="";pinCb=null;clearTimeout(idle)}
function bump(){clearTimeout(idle);if($("#gs").classList.contains("on"))idle=setTimeout(lockGal,180000)}
["pointerdown","keydown","scroll"].forEach(t=>addEventListener(t,bump,true));
document.addEventListener("visibilitychange",()=>{if(document.hidden&&!picking)lockGal()});
$("#gX").onclick=lockGal;
$("#gs .sh-h").addEventListener("pointerup",ev=>{if(ev.target.closest("button"))return;const n=Date.now();if(n-lt<400)lockGal();lt=n});
const pick=el=>{picking=true;setTimeout(()=>picking=false,90000);el.click()};

/* álbuns */
function allAlbs(){let a=[];try{a=JSON.parse(LS.get("calc_albs")||"[]")}catch(_){}items.forEach(i=>{if(i.album&&!a.includes(i.album))a.push(i.album)});return a}
function tb(){const A=allAlbs(),c=(on,x)=>'<button class="chip'+(on?" on":"")+'" '+x;
  $("#gtb").innerHTML='<div class="chips">'+c(tab==="f",'data-t="f">Fotos</button>')+c(tab==="n",'data-t="n">Notas</button>')+(tab==="f"?c(selMode,'data-s="1">Selecionar</button>'):c(0,'data-n="1">+ Nova nota</button>'))+'</div>'+
  (tab==="f"?'<div class="chips">'+c(!alb,'data-a="">Todos</button>')+A.map(a=>c(alb===a,'data-a="'+esc(a)+'">'+esc(a)+'</button>')).join("")+c(0,'data-na="1">+ Álbum</button>')+'</div>':"")}
$("#gtb").onclick=ev=>{const c=ev.target.closest(".chip");if(!c)return;const d=c.dataset;
  if(d.t){tab=d.t;sel.clear();selMode=false;renderGal()}
  else if(d.s!==undefined){selMode=!selMode;sel.clear();renderGal()}
  else if(d.n!==undefined)noteEd(null,"")
  else if(d.na!==undefined)modal("Nome do álbum",v=>{v=v.trim();if(!v)return "Digite um nome";const a=allAlbs();if(!a.includes(v)){a.push(v);LS.set("calc_albs",JSON.stringify(a))}alb=v;renderGal();return true},1)
  else if(d.a!==undefined){alb=d.a;renderGal()}};

/* grade, seleção, visualizador */
const upSb=()=>$("#sDl").textContent="Excluir ("+sel.size+")";
async function renderGal(){const g=$("#gal");urls.forEach(URL.revokeObjectURL);urls=[];g.innerHTML="";if(!K)return;
  try{const L=await loadAll(),keys=L.map(e=>e.k),vals=L.map(e=>e.v);items=[];
    trash=[];for(let i=0;i<keys.length;i++){let v=vals[i];if(v instanceof Blob){v=await seal(await v.arrayBuffer(),v.type,"");await tx("m","readwrite",s=>s.put(v,keys[i]))}if(v.del)trash.push({k:keys[i],...v});else items.push({k:keys[i],...v})}
  }catch(x){g.innerHTML=msg("Não foi possível acessar o armazenamento deste navegador.");return}
  tb();$("#sb").classList.toggle("on",selMode&&tab==="f");upSb();{const q=$("#qn");if(q)q.style.display=tab==="n"?"block":"none"}
  if(tab==="n"){g.className="gal notes";const ns=items.filter(i=>i.type==="note").reverse();
    if(!ns.length){g.innerHTML=msg("Nenhuma nota.<br>Toque em “+ Nova nota”.");return}
    let shown=0;
    for(const it of ns){let t="";try{t=JSON.parse(new TextDecoder().decode(await unseal(it))).t}catch(_){}
      if(!mt(qN,[t]))continue;shown++;
      const d=document.createElement("div");d.className="h";d.style.textAlign="left";d.innerHTML="<b></b>";d.firstChild.style.fontSize="18px";d.firstChild.textContent=t.split("\n")[0].slice(0,80)||"(vazia)";d.onclick=()=>noteEd(it,t);g.append(d)}
    if(!shown)g.innerHTML=msg("Nada encontrado.");
    return}
  g.className="gal";vis=items.filter(i=>!i.kind&&i.type!=="note"&&(!alb||i.album===alb));
  if(!vis.length){g.innerHTML=msg("Nada aqui ainda.<br>Toque em “+ Adicionar” para guardar fotos e vídeos"+(alb?" neste álbum":"")+".");return}
  vis.forEach((it,i)=>{const t=document.createElement("div");t.className="t"+(sel.has(it.k)?" s":"");const isV=it.type.startsWith("video");t.innerHTML='<img alt="">'+(isV?'<span class="pp">▶</span><span class="pb"></span>':'');g.append(t);
    t.onclick=()=>{if(selMode){sel.has(it.k)?sel.delete(it.k):sel.add(it.k);t.classList.toggle("s");upSb()}else showV(i)};
    const c=thCache.get(it.k);if(c){isV?setPoster(t,c):t.firstChild.src=c.u;return}tq=tq.then(async()=>{if(!t.isConnected||!K)return;const r=await thumbOf(it);if(!r)return;const c2={u:r.url,d:r.d};thCache.set(it.k,c2);isV?setPoster(t,c2):t.firstChild.src=c2.u}).catch(()=>{})})}
let vu=null;
async function showV(i){vi=i;const it=vis[i],c=$("#gvc");let b;try{b=await unseal(it)}catch(_){toast("Não foi possível abrir");return}if(vu)URL.revokeObjectURL(vu);vu=URL.createObjectURL(new Blob([b],{type:it.type}));c.innerHTML=it.type.startsWith("video")?'<video controls autoplay playsinline></video>':'<img alt="">';c.firstChild.src=vu;$("#gv").classList.add("on")}
$("#gvc").addEventListener("touchstart",e=>{tx0=e.touches[0].clientX},{passive:true});
$("#gvc").addEventListener("touchend",e=>{const im=$("#gvc img");if(im&&im.style.transform)return;const d=e.changedTouches[0].clientX-tx0;if(Math.abs(d)>60){const n=vi+(d<0?1:-1);if(n>=0&&n<vis.length)showV(n)}});
$("#gvc").addEventListener("click",e=>{const im=$("#gvc img");if(!im||e.target!==im)return;const n=Date.now();if(n-lt2<300){if(im.style.transform)im.style.transform="";else{const r=im.getBoundingClientRect();im.style.transformOrigin=((e.clientX-r.left)/r.width*100)+"% "+((e.clientY-r.top)/r.height*100)+"%";im.style.transform="scale(2.5)"}}lt2=n});
$("#gvX").onclick=()=>{$("#gv").classList.remove("on");$("#gvc").innerHTML=""};
$("#gvD").onclick=async()=>{const it=vis[vi];if(!it||!await yes("Excluir este item?"))return;await tx("m","readwrite",s=>s.delete(it.k));$("#gv").classList.remove("on");$("#gvc").innerHTML="";renderGal()};
$("#sCn").onclick=()=>{selMode=false;sel.clear();renderGal()};
$("#sDl").onclick=async()=>{if(!sel.size||!await yes("Excluir "+sel.size+" item(ns)?"))return;for(const k of sel)await tx("m","readwrite",s=>s.delete(k));selMode=false;sel.clear();renderGal()};
$("#sMv").onclick=()=>{if(!sel.size)return;modal("Mover para o álbum (vazio = sem álbum)",async v=>{v=v.trim();if(v){const a=allAlbs();if(!a.includes(v)){a.push(v);LS.set("calc_albs",JSON.stringify(a))}}
  for(const it of items)if(sel.has(it.k)){const r=await tx("m","readonly",s=>s.get(it.k));r.album=v;await tx("m","readwrite",s=>s.put(r,it.k))};selMode=false;sel.clear();renderGal();return true},1)};
$("#gAdd").onclick=()=>pick($("#gFile"));
$("#gFile").onchange=async ev=>{const fs=[...ev.target.files];picking=false;ev.target.value="";if(!K)return;
  for(const f of fs){const s=await seal(await f.arrayBuffer(),f.type||"application/octet-stream",alb);await tx("m","readwrite",st=>st.add(s))}tab="f";renderGal()};

/* notas */
function noteEd(it,t){nid=it?it.k:null;$("#nt").value=t||"";$("#nv").classList.add("on")}
$("#nB").onclick=()=>$("#nv").classList.remove("on");
$("#nS").onclick=async()=>{const t=$("#nt").value;if(t.trim()){const s=await seal(enc.encode(JSON.stringify({t})),"note","");await tx("m","readwrite",st=>nid!==null?st.put(s,nid):st.add(s))}$("#nv").classList.remove("on");renderGal()};
$("#nD").onclick=async()=>{if(nid!==null&&await yes("Excluir esta nota?"))await tx("m","readwrite",s=>s.delete(nid));$("#nv").classList.remove("on");renderGal()};

/* ajustes: código, PIN, backup */
async function refreshGm(){const p=await hasPin();$("#gm").innerHTML='<div data-a="code">Alterar código de acesso</div><div data-a="pin">'+(p?"Alterar PIN":"Definir PIN (criptografa)")+'</div>'+(p?'<div data-a="nopin">Remover PIN</div>':"")+'<div data-a="exp">Exportar backup</div><div data-a="imp">Importar backup</div>'}
$("#gm").onclick=ev=>{const a=ev.target.dataset.a;if(!a||!K)return;
  if(a==="code")setSecret("Novo código de acesso (6 a 12 números)",/^\d{6,12}$/,"Use de 6 a 12 números",v=>setCode(v),"Código alterado");
  if(a==="pin")setSecret("Novo PIN (4 a 8 números)",/^\d{4,8}$/,"Use de 4 a 8 números",v=>saveKey(v),"PIN definido");
  if(a==="nopin")modal("Digite o PIN atual para remover",async v=>{try{const r=await tx("k","readonly",s=>s.get("key"));await crypto.subtle.decrypt({name:"AES-GCM",iv:r.iv},await pk(v,r.salt),r.ct)}catch(_){return "PIN incorreto"}await saveKey(null);toast("PIN removido");return true});
  if(a==="exp")exportBk();
  if(a==="imp")pick($("#gImp"))};
async function exportBk(){
  let sk=null;
  try{
    toast("Preparando backup seguro…");
    const L=await loadAll(),r=await tx("k","readonly",s=>s.get("key"));
    const key=r.w?{w:1,salt:b2s(r.salt),iv:b2s(r.iv),ct:b2s(r.ct)}:{w:0,raw:b2s(r.raw)};
    sk=await openSink("galeria-backup.vault");
    const write=async o=>sk.w(JSON.stringify(o)+"\n");
    await write({format:"galeria-vault",v:3,key,created:new Date().toISOString(),chunkBytes:786432});
    let total=0,errors=0,id=0;
    for(const e of L){
      try{
        let v=e.v;
        if(v instanceof Blob)v=await seal(await v.arrayBuffer(),v.type||"application/octet-stream","");
        let ct=v.ct;
        if(!ct)ct=(await tx("m","readonly",s=>s.get(e.k))).ct;
        if(!ct)throw new Error("conteúdo ausente");
        const n=++id,meta={rec:"item",id:n,iv:b2s(v.iv),type:v.type||"application/octet-stream",album:v.album||"",kind:v.kind||"",del:v.del||0,nm:v.nm?{iv:b2s(v.nm.iv),ct:b2s(v.nm.ct)}:null};
        await write(meta);
        const u=new Uint8Array(ct),chunk=786432;
        for(let o=0;o<u.length;o+=chunk){await write({rec:"data",id:n,part:Math.floor(o/chunk),ct:b2s(u.subarray(o,Math.min(u.length,o+chunk)))});}
        await write({rec:"end",id:n});total++;
      }catch(_){errors++}
    }
    await write({rec:"finish",items:total,skipped:errors});
    if(await sk.end()){LS.set("calc_lastbk",Date.now());toast("Backup novo gerado: "+total+" itens"+(errors?"; "+errors+" ignorados":""));}
  }catch(x){const m=String(x&&x.message||x);if(!/cancel/i.test(m))toast("Não foi possível exportar o backup. Verifique o espaço livre e tente novamente.");}
}
$("#gImp").onchange=ev=>{picking=false;const f=ev.target.files[0];ev.target.value="";if(f)importBk(f)};
async function bkHeader(f){
  const rd=f.stream().getReader(),dec=new TextDecoder();let head="",marker='"items":[';
  try{while(true){const {value,done}=await rd.read();if(done)break;head+=dec.decode(value,{stream:true});const at=head.indexOf(marker);if(at>=0){const cut=head.lastIndexOf(',',at);if(cut<0)throw new Error("estrutura");const j=JSON.parse(head.slice(0,cut)+'}');if(!j||!j.key||!(j.key.w===0||j.key.w===1))throw new Error("estrutura");return j}if(head.length>65536)throw new Error("cabeçalho")}throw new Error("items")}finally{try{await rd.cancel()}catch(_){}}
}
async function eachBkItem(f,cb){
  const rd=f.stream().getReader(),dec=new TextDecoder();let buf="",started=false,depth=0,inStr=false,esc=false,obj="",found=false;
  try{
    while(!found){const {value,done}=await rd.read();if(done)throw new Error("items");buf+=dec.decode(value,{stream:true});const at=buf.indexOf('"items":[');if(at>=0){buf=buf.slice(at+9);found=true}else if(buf.length>65536)buf=buf.slice(-32)}
    const consume=async chunk=>{let pieceStart=started?0:-1;for(let i=0;i<chunk.length;i++){const c=chunk[i];if(!started){if(c==='{'){started=true;depth=1;pieceStart=i;inStr=false;esc=false}else if(c===']')return false;continue}
      if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')inStr=false;continue}if(c==='"'){inStr=true;continue}if(c==='{')depth++;else if(c==='}')depth--;if(depth===0){obj+=chunk.slice(pieceStart,i+1);const item=JSON.parse(obj);obj="";started=false;pieceStart=-1;await cb(item)}}if(started&&pieceStart>=0)obj+=chunk.slice(pieceStart);return true};
    if(!await consume(buf))return;buf="";
    while(true){const {value,done}=await rd.read();if(done)break;const chunk=dec.decode(value,{stream:true});if(!await consume(chunk))return}
    const tail=dec.decode();if(tail)await consume(tail);if(started)throw new Error("item incompleto");
  }finally{try{await rd.cancel()}catch(_){}}
}
async function importBk(f){
  try{
    if(!f||!f.stream)throw new Error("Leitor de arquivo indisponível");
    const rd=f.stream().getReader(),dec=new TextDecoder();let buf="",first=null;
    try{
      while(!first){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const at=buf.indexOf("\n");if(at>=0){first=buf.slice(0,at);buf=buf.slice(at+1);break}if(buf.length>131072)throw new Error("Cabeçalho inválido")}
    }finally{try{await rd.cancel()}catch(_){}}
    let h;try{h=JSON.parse(first||buf)}catch(_){throw new Error("Arquivo de backup inválido")}
    if(h&&h.format==="galeria-vault"&&h.v===3){await importBkV3(f);return}
    await importBkLegacy(f);
  }catch(e){toast(String(e&&e.message||e).includes("QuotaExceededError")?"Armazenamento insuficiente para importar o backup":"Não foi possível ler este backup. Confira se o arquivo está completo.")}
}
async function importBkV3(f){
  const rd=f.stream().getReader(),dec=new TextDecoder();let buf="",header=null,rawKey=null,imported=0,skipped=0,seen=false;
  const flushLine=async line=>{
    if(!line.trim())return;
    let o;try{o=JSON.parse(line)}catch(_){skipped++;return}
    if(!header){header=o;if(o.format!=="galeria-vault"||o.v!==3||!o.key)throw new Error("Formato de backup não reconhecido");return}
    if(o.rec==="finish")return;
  };
  // Read and validate only the first record before asking for the PIN.
  const firstReader=f.stream().getReader();let firstLine="";
  try{while(true){const {value,done}=await firstReader.read();if(done)break;firstLine+=dec.decode(value,{stream:true});const i=firstLine.indexOf("\n");if(i>=0){firstLine=firstLine.slice(0,i);break}if(firstLine.length>131072)throw new Error("Cabeçalho inválido")}}finally{try{await firstReader.cancel()}catch(_){}}
  try{header=JSON.parse(firstLine);if(header.format!=="galeria-vault"||header.v!==3||!header.key)throw new Error("Formato de backup inválido")}catch(_){throw new Error("Formato de backup inválido")}
  const startImport=async(raw,pin)=>{
    if(!(raw instanceof Uint8Array)||raw.length!==32)throw new Error("Chave inválida");
    const bk=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    let current=null,chunks=[],lastId=null,finished=false,keySaved=false;
    const saveCurrent=async()=>{
      if(!current)return;
      try{
        if(!chunks.length)throw new Error("sem conteúdo");
        const ct=s2b(chunks.join("")),iv=s2b(current.iv);
        if(iv.length!==12||!ct.length)throw new Error("dados incompletos");
        const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},bk,ct);
        let noteBuf=null;if(current.nm&&current.nm.iv&&current.nm.ct)noteBuf=await crypto.subtle.decrypt({name:"AES-GCM",iv:s2b(current.nm.iv)},bk,s2b(current.nm.ct));
        if(!keySaved){RAW=raw;K=await crypto.subtle.importKey("raw",RAW,"AES-GCM",false,["encrypt","decrypt"]);await saveKey(pin||null);keySaved=true}
        const item=await seal(plain,current.type||"application/octet-stream",current.album||"");
        if(noteBuf){const e=await seal(noteBuf,"t","");item.nm={iv:e.iv,ct:e.ct}}
        if(current.kind)item.kind=current.kind;if(current.del)item.del=current.del;
        await tx("m","readwrite",st=>st.add(item));imported++;
      }catch(_){skipped++}
      current=null;chunks=[];
    };
    // Stream each line; ciphertext is assembled one item at a time, not for the whole backup.
    const reader=f.stream().getReader();let textBuf="",first=true;
    try{
      while(true){const {value,done}=await reader.read();if(done)break;textBuf+=dec.decode(value,{stream:true});let ix;
        while((ix=textBuf.indexOf("\n"))>=0){const line=textBuf.slice(0,ix);textBuf=textBuf.slice(ix+1);if(first){first=false;continue}if(!line.trim())continue;
          let o;try{o=JSON.parse(line)}catch(_){skipped++;continue}
          if(o.rec==="item"){await saveCurrent();current=o;chunks=[];lastId=o.id}
          else if(o.rec==="data"&&current&&o.id===current.id&&typeof o.ct==="string")chunks.push(o.ct);
          else if(o.rec==="end"&&current&&o.id===current.id)await saveCurrent();
          else if(o.rec==="finish"){finished=true;}
        }
      }
      textBuf+=dec.decode();if(textBuf.trim()){try{const o=JSON.parse(textBuf);if(o.rec==="end"&&current&&o.id===current.id)await saveCurrent();else if(o.rec==="finish")finished=true}catch(_){skipped++}}
      await saveCurrent();
    }finally{try{await reader.cancel()}catch(_){}}
    if(!keySaved){if(imported===0)throw new Error("Nenhum item válido foi recuperado; o cofre não foi alterado");RAW=raw;K=await crypto.subtle.importKey("raw",RAW,"AES-GCM",false,["encrypt","decrypt"]);await saveKey(pin||null)}
    renderGal();toast("Importação concluída: "+imported+" recuperados"+(skipped?", "+skipped+" ignorados":""));
  };
  const r=header.key;
  if(r.w===1){modal("PIN do backup",async v=>{try{const salt=s2b(r.salt),iv=s2b(r.iv),ct=s2b(r.ct);const raw=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv},await pk(v,salt),ct));await startImport(raw,v);return true}catch(e){return String(e&&e.message||e).includes("OperationError")?"PIN incorreto ou backup inválido":String(e&&e.message||e)}})}
  else if(r.w===0&&typeof r.raw==="string")await startImport(s2b(r.raw),null);
  else throw new Error("Chave do backup inválida");
}
async function importBkLegacy(f){
  try{
    if(!f||!f.stream)throw new Error("stream indisponível");
    const j=await bkHeader(f),r=j.key;
    const go=async(raw,pin)=>{
      if(!(raw instanceof Uint8Array)||raw.length!==32)throw new Error("chave");
      const bk=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
      let n=0,keySaved=false;
      await eachBkItem(f,async it=>{
        if(!it||typeof it.iv!=="string"||typeof it.ct!=="string"||typeof it.type!=="string")throw new Error("item");
        const iv=s2b(it.iv),ct=s2b(it.ct);if(iv.length!==12||!ct.length)throw new Error("dados");
        const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},bk,ct);
        let noteBuf=null;if(it.nm&&it.nm.iv&&it.nm.ct){const niv=s2b(it.nm.iv),nct=s2b(it.nm.ct);if(niv.length!==12||!nct.length)throw new Error("nota");noteBuf=await crypto.subtle.decrypt({name:"AES-GCM",iv:niv},bk,nct)}
        if(!keySaved){RAW=raw;K=await crypto.subtle.importKey("raw",RAW,"AES-GCM",false,["encrypt","decrypt"]);await saveKey(pin||null);keySaved=true}
        const s=await seal(plain,it.type,it.album||"");if(noteBuf){const e=await seal(noteBuf,"t");s.nm={iv:e.iv,ct:e.ct}}if(it.kind)s.kind=it.kind;if(it.del)s.del=it.del;
        await tx("m","readwrite",st=>st.add(s));n++;
      });
      if(!keySaved){RAW=raw;K=await crypto.subtle.importKey("raw",RAW,"AES-GCM",false,["encrypt","decrypt"]);await saveKey(pin||null)}
      toast(n+" itens importados");renderGal();
    };
    if(r.w===1){
      if(typeof r.salt!=="string"||typeof r.iv!=="string"||typeof r.ct!=="string")throw new Error("chave");
      modal("PIN do backup",async v=>{try{const salt=s2b(r.salt),iv=s2b(r.iv),ct=s2b(r.ct);if(salt.length!==16||iv.length!==12)throw new Error("chave");const raw=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv},await pk(v,salt),ct));await go(raw,v);return true}catch(e){return String(e&&e.message||e).includes("OperationError")?"PIN incorreto ou backup inválido":"Falha ao importar: arquivo muito grande, armazenamento cheio ou dados inválidos"}});
    }else{if(typeof r.raw!=="string")throw new Error("chave");await go(s2b(r.raw),null)}
  }catch(e){toast(String(e&&e.message||e).includes("QuotaExceededError")?"Armazenamento insuficiente para importar o backup":"Arquivo inválido, incompatível ou memória insuficiente")}
}

/* ferramentas da calculadora */
const TL={
 "Moeda":{f:[["Valor na moeda estrangeira",100],["Cotação (R$ por unidade)",5]],r:v=>["Em reais: R$ "+m(v[0]*v[1]),"R$ "+m(v[0])+" = "+m(v[0]/v[1])+" na moeda"]},
 "IMC":{f:[["Peso (kg)",70],["Altura (cm)",170]],r:v=>{const i=v[0]/Math.pow(v[1]/100,2);return["IMC: "+m(i),i<18.5?"Abaixo do peso":i<25?"Peso normal":i<30?"Sobrepeso":"Obesidade"]}},
 "Juros":{f:[["Capital (R$)",1000],["Taxa (% ao mês)",1],["Meses",12]],r:v=>{const c=v[0]*Math.pow(1+v[1]/100,v[2]);return["Composto: R$ "+m(c),"Simples: R$ "+m(v[0]*(1+v[1]/100*v[2])),"Juros (comp.): R$ "+m(c-v[0])]}},
 "Gorjeta":{f:[["Conta (R$)",100],["Gorjeta (%)",10],["Pessoas",2]],r:v=>{const t=v[0]*(1+v[1]/100);return["Total: R$ "+m(t),"Por pessoa: R$ "+m(t/v[2])]}}};
let tool="Moeda";
function renderTool(){$("#tc").innerHTML=Object.keys(TL).map(k=>'<button class="chip'+(k===tool?" on":"")+'">'+k+'</button>').join("");
  $("#tf").innerHTML=TL[tool].f.map(([l,d])=>'<div class="box f"><label>'+l+'</label><input inputmode="decimal" value="'+d+'"></div>').join("");calcTool()}
function calcTool(){const v=[...document.querySelectorAll("#tf input")].map(i=>parseFloat(i.value.replace(",",".")));$("#tr").innerHTML=v.some(isNaN)?"":TL[tool].r(v).map(esc).join("<br>")}
$("#tc").onclick=ev=>{const b=ev.target.closest(".chip");if(b){tool=b.textContent;renderTool()}};
$("#tf").addEventListener("input",calcTool);
renderTool();
</script>

}

async function saveFile(name,blob){

  if(dl){try{await dl.save({filename:name,data:blob});return true}catch(x){const c=x&&x.code;if(c!=="declined")toast(c==="rejected_extension"?"Tipo não permitido para salvar aqui":"Não foi possível salvar");return false}}
  const np=NP();

const h2=async(pin,salt)=>new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveBits"]),256));

async function setPin2(pin){if(!pin){await tx("k","readwrite",s=>s.delete("pin2"));return}const salt=crypto.getRandomValues(new Uint8Array(16)),h=await h2(pin,salt);await tx("k","readwrite",s=>s.put({salt,h},"pin2"))}
async function checkPin2(pin){const r=await tx("k","readonly",s=>s.get("pin2"));if(!r)return true;const h=await h2(pin,r.salt);let d=0;for(let i=0;i<h.length;i++)d|=h[i]^r.h[i];return d===0}
function gate(){return hasPin2().then(has=>{if(!has||P2OK)return true;
  return new Promise(res=>{modal("PIN extra (notas e diário)",async v=>{let ok=false;try{ok=await checkPin2(v)}catch(_){}
    if(ok){P2OK=true;p2f=0;res(true);return true}
    logFail("PIN extra");if(++p2f>=3){p2f=0;res(false);lockGal();return ""}return "PIN incorreto ("+p2f+"/3)"});pcancel=()=>res(false)})})}
const pin2Set=()=>setSecret("Novo PIN extra (4 a 8 números)",/^\d{4,8}$/,"Use de 4 a 8 números",async v=>{await setPin2(v);loadAj()},"PIN extra definido");
const pin2Change=()=>modal("Digite o PIN extra atual",async v=>{if(!await checkPin2(v)){logFail("PIN extra");return "PIN incorreto"}pin2Set();return false});
const pin2Remove=()=>modal("Digite o PIN extra atual para remover",async v=>{if(!await checkPin2(v)){logFail("PIN extra");return "PIN incorreto"}await setPin2(null);toast("PIN extra removido");loadAj();return true});

async function purgeTrash(){if(!K)return;try{await refreshItems();const lim=Date.now()-TRASH_DAYS*864e5;for(const it of trash.filter(i=>i.del<lim))await tx("m","readwrite",s=>s.destroy(it.k))}catch(_){}}
async function trLabel(it){const J=async()=>JSON.parse(dec.decode(await unseal(it)));
  try{
    if(it.type==="note"){const o=await J();return["📝",(o.t||"").split("\n")[0].slice(0,50)||"Nota"]}
    const k=it.kind;
    if(k==="pw"){const o=await J();return["🔑",o.s||"Senha"]}
    if(k==="task"){const o=await J();return["📅",o.t||"Tarefa"]}
    if(k==="diary"){const o=await J();return["📔",(o.t||"").split("\n")[0].slice(0,50)||"Diário"]}
    if(k==="contact"){const o=await J();return["👤",o.n||"Contato"]}
    if(k==="file"||k==="audio"){const n=dec.decode(await unseal(it.nm));return[k==="file"?ico(n):"🎙️",n]}
    if(k==="draw")return["✏️","Rabisco"];
  }catch(_){}
  return it.type&&it.type.startsWith("video")?["🎞️","Vídeo"]:["🖼️","Foto"]}
async function trRestore(it){const v=await tx("m","readonly",s=>s.get(it.k));if(!v||v instanceof Blob)return;delete v.del;await tx("m","readwrite",s=>s.put(v,it.k))}
async function renderLx(){const g=$("#lxl");g.innerHTML="";if(!K)return;
  try{await purgeTrash();await refreshItems()}catch(_){g.innerHTML=msg("Armazenamento indisponível.");return}
  const L=trash.filter(i=>i.kind!=="wall").sort((a,b)=>b.del-a.del);
  if(!L.length){g.innerHTML=msg("Lixeira vazia.<br>Itens excluídos ficam aqui por "+TRASH_DAYS+" dias.");return}
  for(const it of L){const [ic,lb]=await trLabel(it),left=Math.max(1,Math.ceil((it.del+TRASH_DAYS*864e5-Date.now())/864e5));
    const d=document.createElement("div");d.className="row2";d.style.cursor="default";
    d.innerHTML='<span style="font-size:26px"></span><div><b></b><small></small></div><button data-a="r" title="Restaurar">↩</button><button data-a="x" title="Excluir de vez">✕</button>';
    d.firstChild.textContent=ic;d.querySelector("b").textContent=lb;d.querySelector("small").textContent="Apaga sozinho em "+left+" dia"+(left>1?"s":"");
    d.onclick=async ev=>{const a=ev.target.dataset.a;
      if(a==="r"){try{await trRestore(it);toast("Restaurado");renderLx()}catch(_){toast("Não foi possível restaurar")}}
      else if(a==="x"){if(await yes("Excluir de vez? Não dá para recuperar.")){await tx("m","readwrite",s=>s.destroy(it.k));renderLx()}}};
    g.append(d)}}

  if(!last){LS.set("calc_bkbase",now);return}

  LS.set("calc_bknag",now);const n=Math.floor((now-last)/864e5);

<script>
/* ===== Pré-capa dos vídeos na galeria ===== */
let thq=Promise.resolve();const thCache=new Map();
function vposter(u){return new Promise(res=>{const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=u;let done=false;
  const fin=x=>{if(done)return;done=true;try{v.removeAttribute("src");v.load()}catch(_){}res(x)};
  v.onloadeddata=()=>{try{v.currentTime=Math.min(.1,(v.duration||1)/2)}catch(_){fin(null)}};
  v.onseeked=()=>{try{const w=v.videoWidth,h=v.videoHeight;if(!w){fin(null);return}const k=Math.min(1,400/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(v,0,0,c.width,c.height);const d=v.duration;c.toBlob(b=>fin(b?{b,d}:null),"image/jpeg",.75)}catch(_){fin(null)}};
  v.onerror=()=>fin(null);setTimeout(()=>fin(null),10000)})}
function setPoster(t,c){const im=t.querySelector("img");if(im)im.src=c.u;const b=t.querySelector(".pb");if(b&&isFinite(c.d)){const m=Math.floor(c.d/60),x=Math.floor(c.d%60);b.textContent=m+":"+String(x).padStart(2,"0")}}
{const l=lockGal;lockGal=function(){thCache.forEach(c=>URL.revokeObjectURL(c.u));thCache.clear();l()}}
</script>
<script>
/* ===== Desempenho: lista em cache (sem blobs grandes) e miniaturas criptografadas ===== */
async function loadAll(){if(META&&METAN===DBN)return META;const d=await gdb(),out=[];
  await new Promise((ok,no)=>{const q=d.transaction("m","readonly").objectStore("m").openCursor();
    q.onsuccess=()=>{const c=q.result;if(!c)return ok();let v=c.value;
      if(!(v instanceof Blob)&&v.ct){const n=v.ct.byteLength;v=n>262144?{...v,sz:n,ct:null}:{...v,sz:n}}
      out.push({k:c.key,v});c.continue()};q.onerror=()=>no(q.error)});
  META=out;METAN=DBN;return out}
let tq=Promise.resolve();
async function mkThumb(it,full){
  if(it.type.startsWith("video")){const u=URL.createObjectURL(new Blob([full],{type:it.type}));try{const r=await vposter(u);return r&&{b:await r.b.arrayBuffer(),d:r.d}}finally{URL.revokeObjectURL(u)}}
  const bm=await createImageBitmap(new Blob([full],{type:it.type})),k=Math.min(1,320/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(bm.width*k));c.height=Math.max(1,Math.round(bm.height*k));c.getContext("2d").drawImage(bm,0,0,c.width,c.height);if(bm.close)bm.close();
  const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.7));return b&&{b:await b.arrayBuffer()}}
async function thumbOf(it){let t=null;try{t=await tx("t","readonly",s=>s.get(it.k))}catch(_){}
  if(!t){const r=await mkThumb(it,await unseal(it));if(!r)return null;const e=await seal(r.b,"image/jpeg","");t={iv:e.iv,ct:e.ct,d:r.d};try{await tx("t","readwrite",s=>s.put(t,it.k))}catch(_){}}
  const b=await crypto.subtle.decrypt({name:"AES-GCM",iv:t.iv},K,t.ct);return{url:URL.createObjectURL(new Blob([b],{type:"image/jpeg"})),d:t.d}}
{const l=lockGal;lockGal=function(){META=null;if(vu){URL.revokeObjectURL(vu);vu=null}l()};$("#gX").onclick=lockGal}
</script>
